# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  mix-rater:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - MUSIC_RATER_DB=/app/music_rater.db
    volumes:
      - .:/app
      - "${MUSICA:?Pon en .env la carpeta que quieres puntuar (MUSICA)}:/music:ro"
    ports:
      - "${PUERTO:-5021}:5001"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "mix_rater"
      ofelia.job-exec.mix-rater-scan.schedule: "0 50 1 * * *"
      ofelia.job-exec.mix-rater-scan.command: "nice -n 19 ionice -c 3 python3 music_rater.py scan /music"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=mix_rater
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - mix-rater
