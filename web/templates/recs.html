<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Recs</title>
        <style>
            * { box-sizing: border-box; }
            body {
                font-family: sans-serif;
                margin: 40px;
            }
            #sliders > div {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
                flex-wrap: wrap;
            }
            #sliders label {
                min-width: 160px;
            }
            input[type="range"] {
                width: 100%;
                flex: 1;
                min-width: 120px;
                min-height: 24px;
            }
            button {
                min-height: 44px;
                padding: 8px 20px;
            }
            .rec {
                margin: 5px 0;
                padding: 8px 4px;
                min-height: 44px;
                display: flex;
                align-items: center;
                cursor: pointer;
            }
            @media (max-width: 480px) {
                body { margin: 16px; }
                #sliders label { min-width: 100%; }
            }
        </style>
    </head>
    <body>
        <h2>🎚️ Recommendation Engine</h2>

        <div id="sliders"></div>

        <button onclick="search()">Buscar</button>

        <h3>Resultados</h3>
        <div id="results"></div>

        <script src="/static/recs.js"></script>
    <script src="/static/settings-panel.js"></script>
</body>
</html>
